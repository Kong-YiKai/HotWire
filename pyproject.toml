[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-team"
version = "0.1.0"
description = "Multi-agent topic article and podcast script generator built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs",
  "langchain-openai",
  "langgraph",
  "python-dotenv",
]

[project.scripts]
podcast-team = "podcast_team.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
